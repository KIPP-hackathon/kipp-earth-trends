table:
  name: '`earth-trend-data`.transient.tb_merra2_tropt'
  description: Diagnóstico mensal TROPT do produto MERRA-2 M2TMNXSLV 5.12.4, exportado em CSV com subpastas
    anuais. Média mensal de TROPT (tropopause temperature using blended TROPP estimate), na unidade K indicada
    pelo atributo units do arquivo MERRA-2.
  theme: atmosfera
  product: M2TMNXSLV_TROPT
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_TROPT/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  sample_file: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_TROPT/2024/M2TMNXSLV_TROPT_2024_01.csv
  original_sample: MERRA2_400.tavgM_2d_slv_Nx.202401.nc4
  original_long_name: tropopause_temperature_using_blended_TROPP_estimate
  original_units: K
columns:
  lat:
    description: Latitude do ponto da grade, em graus norte.
    unit: degrees_north
  lon:
    description: Longitude do ponto da grade, em graus leste.
    unit: degrees_east
  time:
    description: Timestamp mensal preservado do CSV MERRA-2. Cruzamentos com outras fontes devem considerar
      ano e mês.
    unit: null
  TROPT:
    description: Média mensal de TROPT (tropopause temperature using blended TROPP estimate), na unidade K
      indicada pelo atributo units do arquivo MERRA-2.
    unit: K
    source: Atributos long_name e units do NetCDF original, cabeçalho CSV e especificação MERRA-2.
