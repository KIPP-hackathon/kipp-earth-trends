table:
  name: '`earth-trend-data`.transient.tb_merra2_t2mwet'
  description: Diagnóstico mensal T2MWET do produto MERRA-2 M2TMNXSLV 5.12.4, exportado
    em CSV com subpastas anuais. Média mensal de T2MWET (wet bulb temperature at 2
    m), na unidade K indicada pelo atributo units do arquivo MERRA-2.
  theme: atmosfera
  product: M2TMNXSLV_T2MWET
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_T2MWET/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  sample_file: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_T2MWET/2024/M2TMNXSLV_T2MWET_2024_01.csv
  original_sample: MERRA2_400.tavgM_2d_slv_Nx.202401.nc4
  original_long_name: wet_bulb_temperature_at_2_m
  original_units: K
columns:
  lat:
    description: Latitude do ponto da grade, em graus norte.
    unit: degrees_north
  lon:
    description: Longitude do ponto da grade, em graus leste.
    unit: degrees_east
  time:
    description: Timestamp mensal preservado do CSV MERRA-2. Cruzamentos com outras
      fontes devem considerar ano e mês.
    unit: null
  T2MWET:
    description: Média mensal de T2MWET (wet bulb temperature at 2 m), na unidade
      K indicada pelo atributo units do arquivo MERRA-2.
    unit: K
    source: Atributos long_name e units do NetCDF original, cabeçalho CSV e especificação
      MERRA-2.
  source_file:
    description: URI do CSV de origem no GCS, preservada para rastreabilidade e desempate
      de reingestões.
    unit: null
    source: Databricks _metadata.file_path.
  source_file_modified_at:
    description: Última atualização do arquivo de origem no GCS. A trusted prefere
      o arquivo mais recente ao deduplicar latitude, longitude e data.
    unit: null
    source: Databricks _metadata.file_modification_time.
