table:
  name: '`earth-trend-data`.refined.tb_merra2_ts'
  description: Temperatura mensal da pele da superfície (TS) da reanálise MERRA-2 M2TMNXSLV, versão 5.12.4,
    em grade global. Contém os campos Kelvin e Celsius exportados pelo pipeline KIPP.
  theme: calor
  product: M2TMNXSLV
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  local_evidence:
  - databricks/data-extraction/CONTEXT.md
  - docs/catalogo-fontes-gcp.md
  metadata_uri: null
columns:
  lat:
    description: Latitude do ponto da grade, em graus norte.
    unit: degrees_north
    source: Cabeçalho CSV e coordenadas da fonte.
  lon:
    description: Longitude do ponto da grade, em graus leste, normalizada pelo exportador para [-180, 180).
    unit: degrees_east
    source: Cabeçalho CSV e processamento do exportador.
  time:
    description: Referência temporal do registro mensal preservada do CSV. O timestamp identifica o período
      do produto.
    unit: null
    source: Cabeçalho CSV e convenção temporal do produtor.
  TS_K:
    description: Temperatura da pele da superfície (TS), em kelvin.
    unit: K
    source: https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  TS_C:
    description: Temperatura da pele da superfície em graus Celsius, derivada por TS_K - 273,15.
    unit: degree_Celsius
    source: data/main.py::save_monthly_csv
