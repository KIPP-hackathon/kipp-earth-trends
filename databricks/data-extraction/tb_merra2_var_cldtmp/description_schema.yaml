table:
  name: '`earth-trend-data`.refined.tb_merra2_var_cldtmp'
  description: Diagnóstico mensal Var_CLDTMP do produto MERRA-2 M2TMNXSLV 5.12.4, exportado em CSV com subpastas
    anuais. Variável mensal Var_CLDTMP (Variance of CLDTMP), na unidade K K indicada pelo atributo units do
    arquivo MERRA-2.
  theme: atmosfera
  product: M2TMNXSLV_Var_CLDTMP
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_Var_CLDTMP/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  sample_file: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_Var_CLDTMP/2024/M2TMNXSLV_Var_CLDTMP_2024_01.csv
  original_sample: MERRA2_400.tavgM_2d_slv_Nx.202401.nc4
