table:
  name: '`earth-trend-data`.refined.tb_merra2_tql'
  description: Diagnóstico mensal TQL do produto MERRA-2 M2TMNXSLV 5.12.4, exportado em CSV com subpastas anuais.
    Média mensal de TQL (total precipitable liquid water), na unidade kg m-2 indicada pelo atributo units do
    arquivo MERRA-2.
  theme: atmosfera
  product: M2TMNXSLV_TQL
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_TQL/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  sample_file: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_TQL/2024/M2TMNXSLV_TQL_2024_01.csv
  original_sample: MERRA2_400.tavgM_2d_slv_Nx.202401.nc4
  original_long_name: total_precipitable_liquid_water
  original_units: kg m-2
columns:
  lat:
    description: Latitude do ponto da grade, em graus norte.
    unit: degrees_north
  lon:
    description: Longitude do ponto da grade, em graus leste.
    unit: degrees_east
  time:
    description: Timestamp mensal preservado do CSV MERRA-2. Cruzamentos com outras fontes devem considerar
      ano e mês.
    unit: null
  TQL:
    description: Média mensal de TQL (total precipitable liquid water), na unidade kg m-2 indicada pelo atributo
      units do arquivo MERRA-2.
    unit: kg m-2
    source: Atributos long_name e units do NetCDF original, cabeçalho CSV e especificação MERRA-2.
