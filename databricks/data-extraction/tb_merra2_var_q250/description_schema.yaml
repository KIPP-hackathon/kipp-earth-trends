table:
  name: '`earth-trend-data`.refined.tb_merra2_var_q250'
  description: Diagnóstico mensal Var_Q250 do produto MERRA-2 M2TMNXSLV 5.12.4, exportado em CSV com subpastas
    anuais. Variável mensal Var_Q250 (Variance of Q250), na unidade kg kg-1 kg kg-1 indicada pelo atributo
    units do arquivo MERRA-2.
  theme: atmosfera
  product: M2TMNXSLV_Var_Q250
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_Var_Q250/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  sample_file: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_Var_Q250/2024/M2TMNXSLV_Var_Q250_2024_01.csv
  original_sample: MERRA2_400.tavgM_2d_slv_Nx.202401.nc4
  original_long_name: Variance_of_Q250
  original_units: kg kg-1 kg kg-1
columns:
  lat:
    description: Latitude do ponto da grade, em graus norte.
    unit: degrees_north
  lon:
    description: Longitude do ponto da grade, em graus leste.
    unit: degrees_east
  time:
    description: Timestamp mensal preservado do CSV MERRA-2. Cruzamentos com outras fontes devem considerar
      ano e mês.
    unit: null
  Var_Q250:
    description: Variável mensal Var_Q250 (Variance of Q250), na unidade kg kg-1 kg kg-1 indicada pelo atributo
      units do arquivo MERRA-2.
    unit: kg kg-1 kg kg-1
    source: Atributos long_name e units do NetCDF original, cabeçalho CSV e especificação MERRA-2.
