table:
  name: '`earth-trend-data`.transient.tb_merra2_v10m'
  description: Diagnóstico mensal V10M do produto MERRA-2 M2TMNXSLV 5.12.4, exportado em CSV com subpastas
    anuais. Média mensal de V10M (10-meter northward wind), na unidade m s-1 indicada pelo atributo units do
    arquivo MERRA-2.
  theme: atmosfera
  product: M2TMNXSLV_V10M
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_V10M/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  sample_file: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_V10M/2024/M2TMNXSLV_V10M_2024_01.csv
  original_sample: MERRA2_400.tavgM_2d_slv_Nx.202401.nc4
  original_long_name: 10-meter_northward_wind
  original_units: m s-1
columns:
  lat:
    description: Latitude do ponto da grade, em graus norte.
    unit: degrees_north
  lon:
    description: Longitude do ponto da grade, em graus leste.
    unit: degrees_east
  time:
    description: Timestamp mensal preservado do CSV MERRA-2. Cruzamentos com outras fontes devem considerar
      ano e mês.
    unit: null
  V10M:
    description: Média mensal de V10M (10-meter northward wind), na unidade m s-1 indicada pelo atributo units
      do arquivo MERRA-2.
    unit: m s-1
    source: Atributos long_name e units do NetCDF original, cabeçalho CSV e especificação MERRA-2.
