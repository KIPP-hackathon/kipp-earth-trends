table:
  name: '`earth-trend-data`.refined.tb_merra2_to3'
  description: Diagnóstico mensal TO3 do produto MERRA-2 M2TMNXSLV 5.12.4, exportado em CSV com subpastas anuais.
    Média mensal de TO3 (total column ozone), na unidade Dobsons indicada pelo atributo units do arquivo MERRA-2.
  theme: atmosfera
  product: M2TMNXSLV_TO3
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_TO3/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  sample_file: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_TO3/2024/M2TMNXSLV_TO3_2024_01.csv
  original_sample: MERRA2_400.tavgM_2d_slv_Nx.202401.nc4
  original_long_name: total_column_ozone
  original_units: Dobsons
columns:
  lat:
    description: Latitude do ponto da grade, em graus norte.
    unit: degrees_north
  lon:
    description: Longitude do ponto da grade, em graus leste.
    unit: degrees_east
  time:
    description: Timestamp mensal preservado do CSV MERRA-2. Cruzamentos com outras fontes devem considerar
      ano e mês.
    unit: null
  TO3:
    description: Média mensal de TO3 (total column ozone), na unidade Dobsons indicada pelo atributo units
      do arquivo MERRA-2.
    unit: Dobsons
    source: Atributos long_name e units do NetCDF original, cabeçalho CSV e especificação MERRA-2.
