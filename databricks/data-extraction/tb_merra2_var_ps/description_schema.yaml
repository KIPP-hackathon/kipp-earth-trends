table:
  name: '`earth-trend-data`.transient.tb_merra2_var_ps'
  description: Diagnóstico mensal Var_PS do produto MERRA-2 M2TMNXSLV 5.12.4, exportado em CSV com subpastas
    anuais. Variável mensal Var_PS (Variance of PS), na unidade Pa Pa indicada pelo atributo units do arquivo
    MERRA-2.
  theme: atmosfera
  product: M2TMNXSLV_Var_PS
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_Var_PS/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  sample_file: gs://nasa-earth-trends-lab-raw/transient/M2TMNXSLV_Var_PS/2024/M2TMNXSLV_Var_PS_2024_01.csv
  original_sample: MERRA2_400.tavgM_2d_slv_Nx.202401.nc4
  original_long_name: Variance_of_PS
  original_units: Pa Pa
columns:
  lat:
    description: Latitude do ponto da grade, em graus norte.
    unit: degrees_north
  lon:
    description: Longitude do ponto da grade, em graus leste.
    unit: degrees_east
  time:
    description: Timestamp mensal preservado do CSV MERRA-2. Cruzamentos com outras fontes devem considerar
      ano e mês.
    unit: null
  Var_PS:
    description: Variável mensal Var_PS (Variance of PS), na unidade Pa Pa indicada pelo atributo units do
