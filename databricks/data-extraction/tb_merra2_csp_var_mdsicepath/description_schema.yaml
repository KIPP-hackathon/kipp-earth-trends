table:
  name: '`earth-trend-data`.transient.tb_merra2_csp_var_mdsicepath'
  description: Variância mensal Var_MDSICEPATH da coleção MERRA-2 M2TMNXCSP, versão
    5.12.4, em grade global. modis ice water path mean. CSV exportado para a grade
    de 0,5 por 0,625 grau.
  theme: nuvens
  product: M2TMNXCSP
  source_path: gs://nasa-earth-trends-lab-raw/transient/M2TMNXCSP_Var_MDSICEPATH/
provenance:
  reviewed_on: '2026-11-14'
  references:
  - https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
  local_evidence:
  - docs/fontes-transient-dados.csv
  metadata_uri: null
columns:
  lat:
    description: Latitude do ponto da grade, em graus norte.
    unit: degrees_north
    source: Cabeçalho CSV e coordenadas da fonte.
  lon:
    description: Longitude do ponto da grade, em graus leste, normalizada pelo exportador
      para [-180, 180).
    unit: degrees_east
    source: Cabeçalho CSV e processamento do exportador.
  time:
    description: Referência temporal mensal preservada do CSV; comparar produtos por
      ano e mês.
    unit: null
    source: Cabeçalho e amostra CSV da origem.
  Var_MDSICEPATH:
    description: 'Variância mensal de MDSICEPATH (modis ice water path mean), coleção
      MERRA-2 M2TMNXCSP. Unidade: (Kg m-2)^2. Valores preservados do CSV. Diagnóstico
      do simulador COSP; não representa observação direta do satélite MODIS/ISCCP.'
    unit: (Kg m-2)^2
    source: https://gmao.gsfc.nasa.gov/pubs/docs/Bosilovich785.pdf
    unit_derivation: Unidade ao quadrado da variável base na especificação MERRA-2;
      campo Var_ preservado do exportador, sem conversão numérica.
