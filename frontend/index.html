<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d3d8df" />
    <meta
      name="description"
      content="Explore real monthly fields derived from NASA products. Compare regions and months, explore historical events and export observations with source, method and quality metadata."
    />
    <link rel="icon" type="image/png" sizes="128x128" href="/assets/kipp/kipp-favicon-v3.png" />
    <link rel="icon" type="image/gif" sizes="96x96" media="(prefers-reduced-motion: no-preference)" href="/assets/kipp/kipp-favicon-v3.gif" />
    <link rel="preload" href="/assets/globe.webp" as="image" />
    <title>KIPP — every change tells a story</title>
    <style>
      .boot-loader { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 18px; background: #040914; color: #c4d9ee; font: 14px system-ui, sans-serif; text-align: center; }
      .boot-loader svg { width: 48px; height: 48px; color: #9cdeeb; }
      .boot-loader-orbit { transform-origin: 20px 20px; animation: boot-orbit 1.6s linear infinite; }
      .boot-loader small { color: #8fa3bf; }
      body:has(.boot-loader) { margin: 0; background: #040914; }
      @keyframes boot-orbit { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-loader-orbit { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="16" stroke="currentColor" opacity=".18" />
          <g class="boot-loader-orbit">
            <circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="1.75" stroke-dasharray="33 68" />
            <circle cx="20" cy="4" r="2.5" fill="#e6faff" />
          </g>
          <circle cx="20" cy="20" r="5" fill="currentColor" opacity=".7" />
        </svg>
        <span>Opening KIPP</span>
        <small>Your Earth investigation is a moment away.</small>
        <noscript>Enable JavaScript to explore Earth data.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
